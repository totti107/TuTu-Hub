name: Build Prayer & Hadith TV

# Separate app in prayer-tv/. Builds on any push that touches it and publishes the APK to the fixed
# "prayer-tv" release (never marked latest, so TuTu's updater ignores it).
on:
  push:
    paths:
      - "prayer-tv/**"
      - ".github/workflows/prayer-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-tv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prayer-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk PrayerHadithTV.apk
          ls -la PrayerHadithTV.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prayer-tv
          target_commitish: ${{ github.sha }}
          name: Prayer & Hadith TV (build ${{ github.run_number }})
          body: |
            Standalone Android TV app: prayer times plus a rotating Sahih Muslim hadith, also usable as the TV screen saver.
            Install: download PrayerHadithTV.apk on the TV (e.g. with the Downloader app) and open it.
          make_latest: "false"
          files: prayer-tv/PrayerHadithTV.apk
