name: Build TuTu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The signing key is stored encrypted; KEYSTORE_PASSWORD (a repo secret) unlocks it.
      # Same key every time, so each new version installs over the old one.
      - name: Unlock signing key
        env:
          K: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$K" ]; then echo "::error::Add the KEYSTORE_PASSWORD secret (Settings → Secrets and variables → Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/arena.jks.enc -out app/arena.jks -pass env:K

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Find APK
        id: apk
        run: |
          f=$(ls app/build/outputs/apk/release/TuTuTV-v*.apk | head -1)
          v=$(basename "$f" .apk | sed 's/^TuTuTV-v//')
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt

      # The app checks the latest release ("v<version>-<build>") and offers it as an update.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.build }}
          name: TuTu ${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.build }})
          body_path: notes.txt
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
